{% extends 'adminnavbar.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Edit Drug</h5>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                        </div>

                        <!-- Image -->
                        <div class="mb-3">
                            <label class="form-label">Image</label>
                            <input type="file" name="image" class="form-control">
                            <small class="text-muted">Leave blank to keep existing image</small>
                        </div>

                        <!-- Category -->
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select" required>
                                {% for c in cat %}
                                    <option value="{{ c.id }}" {% if product.categories.id == c.id %}selected{% endif %}>
                                        {{ c.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Supplier -->
                        <div class="mb-3">
                            <label class="form-label">Supplier</label>
                            <select name="supplier" class="form-select">
                                <option value="">Select Supplier (Optional)</option>
                                {% for s in suppliers %}
                                    <option value="{{ s.id }}" {% if product.supplier.id == s.id %}selected{% endif %}>
                                        {{ s.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Stock -->
                        <div class="mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" name="stock" class="form-control" value="{{ product.stock }}" required>
                        </div>

                        <!-- Buy Price -->
                        <div class="mb-3">
                            <label class="form-label">Buy Price (Cost)</label>
                            <input type="number" name="buy_price" step="0.01" class="form-control" value="{{ product.buy_price }}" required>
                        </div>

                        <!-- Price -->
                        <div class="mb-3">
                            <label class="form-label">Selling Price</label>
                            <input type="number" name="price" step="0.01" class="form-control" value="{{ product.price }}" required>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="3" required>{{ product.description }}</textarea>
                        </div>

                        <!-- Manufacture Date -->
                        <div class="mb-3">
                            <label class="form-label">Manufacture Date</label>
                            <input type="date" name="manufacture_date" class="form-control" 
                                   value="{{ product.manufacture_date|date:'Y-m-d' }}" required>
                        </div>

                        <!-- Expiry Date -->
                        <div class="mb-3">
                            <label class="form-label">Expiry Date</label>
                            <input type="date" name="expiry_date" class="form-control" 
                                   value="{{ product.expiry_date|date:'Y-m-d' }}" required>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-end">
                            <a href="{% url 'inventory' %}" class="btn btn-secondary me-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
