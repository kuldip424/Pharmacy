{% extends 'navbar.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card border-0 shadow-lg p-5 rounded-4 bg-white">
            
            <h3 class="fw-bold text-dark mb-3">Secure Payment</h3>
            <p class="text-muted mb-4">
                Click below to proceed with Razorpay payment
            </p>

            <!-- Hidden CSRF form (IMPORTANT) -->
            <form id="csrf-form" style="display:none;">
                {% csrf_token %}
            </form>

            <button id="rzp-button" class="btn btn-primary btn-lg rounded-pill px-5 py-3 fw-bold shadow">
                Pay Now
            </button>
        </div>
    </div>
</div>

<!-- Razorpay Script -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
    var options = {
        "key": "{{ razorpay_merchant_key }}",
        "amount": {{ razorpay_amount }}, // Pass as number
        "currency": "{{ currency }}",
        "name": "Pharmacy Management System",
        "description": "Order Payment",
        "order_id": "{{ razorpay_order_id }}",
        "retry": {
            "enabled": true
        },
        "config": {
            "display": {
                "blocks": {
                    "banks": {
                        "name": "Recommended Methods",
                        "instruments": [
                            {
                                "method": "upi"
                            },
                            {
                                "method": "card"
                            },
                            {
                                "method": "netbanking"
                            }
                        ]
                    }
                },
                "sequence": ["block.banks"],
                "preferences": {
                    "show_default_blocks": true
                }
            }
        },
        "handler": function (response){
            console.log("Payment successful, received response:", response);
            
            // Get CSRF token
            var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

            // Create a form to post to the handler
            var form = document.createElement("form");
            form.method = "POST";
            form.action = "{% url 'payment_handler' %}";

            var fields = {
                'razorpay_payment_id': response.razorpay_payment_id,
                'razorpay_order_id': response.razorpay_order_id,
                'razorpay_signature': response.razorpay_signature,
                'csrfmiddlewaretoken': csrfToken
            };

            for (var key in fields) {
                var input = document.createElement("input");
                input.type = "hidden";
                input.name = key;
                input.value = fields[key];
                form.appendChild(input);
            }

            document.body.appendChild(form);
            console.log("Submitting payment verification form...");
            form.submit();
        },
        "prefill": {
            "name": "{{ request.session.name|default:'' }}",
            "email": "{{ request.session.login|default:'' }}"
        },
        "theme": {
            "color": "#28a745"
        },
        "modal": {
            "ondismiss": function(){
                console.log("Payment window closed by user");
            }
        }
    };

    console.log("Initializing Razorpay with options:", {
        key: options.key,
        amount: options.amount,
        order_id: options.order_id
    });

    var rzp1 = new Razorpay(options);

    rzp1.on('payment.failed', function (response){
        console.error("Payment failed:", response.error);
        alert("Payment Failed: " + response.error.description);
    });

    window.onload = function() {
        console.log("Auto-opening Razorpay checkout...");
        rzp1.open();
    };

    document.getElementById('rzp-button').onclick = function(e){
        rzp1.open();
        e.preventDefault();
    }
</script>

{% endblock content %}
